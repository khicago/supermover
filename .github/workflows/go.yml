name: Go

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check module tidiness
        run: go mod tidy -diff

      - name: Test
        run: go test -count=1 ./...

      - name: Race test
        run: go test -race -count=1 ./...

      - name: Coverage
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Vet
        run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2025.1.1

      - name: Staticcheck
        run: staticcheck ./...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: GolangCI-Lint
        run: golangci-lint run ./...

      - name: Whitespace check
        run: git diff --check

      - name: CLI smoke
        run: |
          go run ./cmd/supermover help
          go run ./cmd/supermover version

  macos-app:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Swift tests
        run: swift test --package-path macos

      - name: Script syntax
        run: |
          sh -n macos/script/bootstrap-build-env.sh
          sh -n macos/script/build-app.sh
          sh -n macos/script/audit-app.sh
          sh -n macos/script/notarize-app.sh
          sh -n macos/script/acceptance-loopback.sh
          sh -n macos/script/acceptance-two-machine.sh

      - name: macOS build environment
        run: macos/script/bootstrap-build-env.sh --for-build-app

      - name: Build local app bundle
        run: macos/script/build-app.sh

      - name: Bundled CLI smoke
        run: macos/dist/SuperMover.app/Contents/Resources/bin/supermover version
